name: Import Official PLVR Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1,15 * *"

permissions: {}

concurrency:
  group: official-plvr-market-import
  cancel-in-progress: false

jobs:
  discover-and-import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-market-import
    permissions: {}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pipeline configuration
        env:
          MARKET_PIPELINE_DATABASE_URL: ${{ secrets.MARKET_PIPELINE_DATABASE_URL }}
        run: |
          set -euo pipefail
          python scripts/plvr_market_pipeline.py discover
          test -n "$MARKET_PIPELINE_DATABASE_URL"
      - name: Run operator-approved import
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          MARKET_PIPELINE_DATABASE_URL: ${{ secrets.MARKET_PIPELINE_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "MARKET_IMPORT_STATUS=configuration_required"
          echo "MARKET_IMPORT_STATUS=operator_approval_required"
