name: Security and Performance Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend_next/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt "pytest>=8,<9"
      - name: Install frontend dependencies
        run: npm ci --prefix frontend_next
      - name: Run Python security and contract tests
        run: python -m pytest -q --basetemp "${RUNNER_TEMP}/security-performance-pytest"
      - name: Build frontend
        run: npm --prefix frontend_next run build
      - name: Check bundle and route budgets
        run: |
          python scripts/check_frontend_bundle_budget.py
          python scripts/check_route_budgets.py
      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Generate SBOM artifact
        run: python scripts/generate_sbom.py > "${RUNNER_TEMP}/proptech-sbom.json"
      - name: Run local release gate
        run: python scripts/security_performance_release_gate.py --json
      - name: Dependency audit (network-enabled CI only)
        run: |
          npm audit --prefix frontend_next --audit-level=high
          python -m pip install "pip-audit>=2,<3"
          python -m pip_audit -r backend/requirements.txt --strict
      - name: Upload bounded SBOM
        uses: actions/upload-artifact@v4
        with:
          name: proptech-sbom
          path: ${{ runner.temp }}/proptech-sbom.json
          if-no-files-found: error

  performance-smoke:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PERF_SAMPLES: "3"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend_next/package-lock.json
      - name: Install local benchmark dependencies
        run: |
          python -m pip install -r backend/requirements.txt "pytest>=8,<9"
          npm ci --prefix frontend_next
          npm --prefix frontend_next exec -- playwright install chromium --with-deps
      - name: Build production frontend
        run: npm --prefix frontend_next run build
      - name: Run route bundle analysis and budgets
        run: |
          python scripts/analyze_next_bundle.py --output "${RUNNER_TEMP}/route-bundle-report.json"
          python scripts/check_frontend_bundle_budget.py
          python scripts/check_route_budgets.py
      - name: Run local API, database, and bounded load smoke
        run: |
          python scripts/benchmark_local_api.py --output "${RUNNER_TEMP}/api-benchmark.json"
          python scripts/benchmark_pilot_sqlite.py --output "${RUNNER_TEMP}/database-benchmark.json"
          python scripts/run_bounded_load.py --output "${RUNNER_TEMP}/load-smoke.json"
      - name: Start local production server
        run: |
          npm --prefix frontend_next run start -- -p 3100 > "${RUNNER_TEMP}/next-server.log" 2>&1 &
          for attempt in $(seq 1 60); do curl --fail --silent --show-error http://127.0.0.1:3100/ >/dev/null && break; sleep 1; done
      - name: Run browser performance equivalent and memory smoke
        working-directory: frontend_next
        env:
          PERF_PORT: "3100"
          PERF_PROFILE: "desktop"
        run: |
          node ../scripts/measure_browser_performance.cjs > "${RUNNER_TEMP}/browser-desktop.json"
          PERF_PROFILE=mobile node ../scripts/measure_browser_performance.cjs > "${RUNNER_TEMP}/browser-mobile.json"
          node ../scripts/measure_memory_regressions.cjs > "${RUNNER_TEMP}/memory-regression.json"
      - name: Upload local performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-performance-local-evidence
          path: ${{ runner.temp }}/*-benchmark.json
          if-no-files-found: warn
