name: Hosted Production Smoke

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bounded hosted smoke
        env:
          FRONTEND_PRODUCTION_URL: ${{ secrets.FRONTEND_PRODUCTION_URL }}
          BACKEND_PRODUCTION_URL: ${{ secrets.BACKEND_PRODUCTION_URL }}
          PRODUCTION_SMOKE_TOKEN: ${{ secrets.PRODUCTION_SMOKE_TOKEN }}
          EXPECTED_RELEASE_VERSION: ${{ secrets.EXPECTED_RELEASE_VERSION }}
          EXPECTED_FRONTEND_COMMIT_SHA: ${{ vars.EXPECTED_FRONTEND_COMMIT_SHA }}
          EXPECTED_BACKEND_COMMIT_SHA: ${{ vars.EXPECTED_BACKEND_COMMIT_SHA }}
        run: |
          set -euo pipefail
          if [ -z "${FRONTEND_PRODUCTION_URL}" ] || [ -z "${BACKEND_PRODUCTION_URL}" ] || [ -z "${EXPECTED_RELEASE_VERSION}" ] || [ -z "${EXPECTED_FRONTEND_COMMIT_SHA}" ] || [ -z "${EXPECTED_BACKEND_COMMIT_SHA}" ]; then
            echo "HOSTED_SMOKE=configuration_required"
            exit 0
          fi
          python scripts/production_smoke.py \
            --hosted \
            --frontend-url "${FRONTEND_PRODUCTION_URL}" \
            --backend-url "${BACKEND_PRODUCTION_URL}" \
            --expected-environment production \
            --expected-release "${EXPECTED_RELEASE_VERSION:-}" \
            --smoke-token "${PRODUCTION_SMOKE_TOKEN:-}" \
            --timeout 20
