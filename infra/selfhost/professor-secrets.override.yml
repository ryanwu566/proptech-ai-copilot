# PREPARED ONLY. Append after the existing Stage 1 overrides with a reviewed v2
# image containing professor_runtime_entrypoint.py. Compose >=2.24.4 is required
# for !override: a prior override must not add extra credentials to this profile.
# Existing initialized databases only; use the original provisioning compose
# separately for a reviewed new disposable database initialization.
services:
  postgres_app:
    secrets: !override [app_admin_password]
  postgres_usage:
    secrets: !override [usage_admin_password]
  api:
    image: "${PROFESSOR_SERVER_API_IMAGE:?reviewed Stage 2 API image required}"
    pull_policy: never
    entrypoint: [python, scripts/ops/professor_runtime_entrypoint.py]
    command: [api]
    environment:
      POSTGRES_SSLMODE: verify-full
      PGSSLROOTCERT: /run/selfhost-ca/ca.crt
      PLVR_DATA_BACKEND: blue
      VALUATION_DEMO_MODE: "false"
      PLVR_SERVING_EXCLUSIONS_ENABLED: "true"
      WRA_FLOOD_LOCAL_ROOT: /srv/proptech/datasets/wra/flood/v1
      EARTH_ENGINE_SATELLITE_REFERENCE_V1: "false"
      FEATURE_IDENTITY_V1: "false"
      FEATURE_LEGACY_CASE_IMPORT_V1: "false"
      FEATURE_CASE_PARCEL_SET_V1: "false"
      TAIPEI_PLANNING_READ_V1: "false"
      ANTI_ABUSE_MARKET_OPS_DISABLED: "true"
      ANTI_ABUSE_GEOCODING_DISABLED: "true"
      ANTI_ABUSE_PLACES_DISABLED: "true"
      ANTI_ABUSE_ROUTES_DISABLED: "true"
      ANTI_ABUSE_SATELLITE_DISABLED: "true"
      ANTI_ABUSE_LOCATION_DISABLED: "true"
      ANTI_ABUSE_PARCEL_DISABLED: "true"
      ANTI_ABUSE_ARDSWC_DISABLED: "true"
      ANTI_ABUSE_LIQUEFACTION_DISABLED: "true"
      ANTI_ABUSE_NLSC_DISABLED: "true"
      ANTI_ABUSE_TGOS_DISABLED: "true"
    secrets: !override
      - app_database_url
      - usage_database_url
      - usage_peer_hmac_key
      - pilot_session_signing_key
      - valuation_database_url
    healthcheck:
      test: [CMD, python, scripts/ops/professor_runtime_entrypoint.py, health]
secrets:
  valuation_database_url:
    file: "${SELFHOST_SECRETS_DIR:?absolute secret directory required}/valuation_database_url"
