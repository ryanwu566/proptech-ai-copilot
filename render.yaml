services:
  - type: web
    name: proptech-ai-copilot-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api_main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_RUNTIME
        value: standard
      - key: DATABASE_URL
        sync: false
      - key: PILOT_EVIDENCE_DATABASE_URL
        sync: false
          - key: PUBLIC_APP_BASE_URL
            sync: false
          - key: BACKEND_PUBLIC_URL
            sync: false
          - key: API_CONTRACT_VERSION
            value: api-contract-v1
          - key: SCHEMA_VERSION
            value: schema-007
          - key: RELEASE_COMMIT_SHA
            sync: false
          - key: BUILD_TIMESTAMP
            sync: false
          - key: POSTGRES_SSLMODE
            sync: false
          - key: MAINTENANCE_MODE
            value: "false"
      - key: PILOT_SESSION_SIGNING_KEY
        sync: false
      - key: PILOT_ADMIN_TOKEN
        sync: false
      - key: PILOT_REVIEW_TOKEN
        sync: false
      - key: RELEASE_VERSION
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: VALUATION_DATABASE_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TGOS_APP_ID
        sync: false
      - key: TGOS_API_KEY
        sync: false
      - key: TDX_CLIENT_ID
        sync: false
      - key: TDX_CLIENT_SECRET
        sync: false
      - key: COMMUTE_REFRESH_TOKEN
        sync: false
